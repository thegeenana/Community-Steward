spring:
  application:
    name: community-steward
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/community_steward}
    username: ${DATABASE_USERNAME:steward}
    password: ${DATABASE_PASSWORD:steward}
community-steward:
  github:
    webhook:
      secret: ${GITHUB_WEBHOOK_SECRET:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

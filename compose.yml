services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: community_steward
      POSTGRES_USER: steward
      POSTGRES_PASSWORD: steward
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steward -d community_steward"]
      interval: 5s
      timeout: 3s
      retries: 10
